"1.0.0":
    - "Initialize Goods Received Notes plugin scaffold."
"1.0.1":
    - "Schema lock: invoices, lines, offers active_managed_by."
    - create_logingrupa_goods_received_invoices_table.php
    - create_logingrupa_goods_received_invoice_lines_table.php
    - update_lovata_shopaholic_offers_add_active_managed_by.php
"1.0.2":
    - "LV Pavadzime template import (R22 rows, Svitrukods EAN), missing-EAN-column reject with contact message, duplicate-download filename tolerance, in-modal upload errors, footer reset button, button spinner, labeled rollback button."
"1.0.3":
    - "Recompute CLI fixes: new --site option pins which site's settings row is read, the run now prints the resolved site and both toggles, offer and product caches are flushed after the pass, and reconcileAll reactivates parent products like the invoice path already did."
"1.0.4":
    - "A successful initial reset now switches allow_initial_reset back off, so the destructive path closes itself instead of waiting for the operator to remember. A refused reset leaves the toggle alone."
"1.0.5":
    - "The DRY invariant test scans the plugin in PHP instead of shelling out to grep. The old form redirected stderr to /dev/null, which cmd.exe cannot parse, so the command died and the test read zero hits and failed on every Windows checkout while passing on the servers. The scan still covers every file type rather than just PHP, because the invariant exists to stop the invoice line column partial re-implementing the variation regex."
"1.0.6":
    - "The parser now selects invoice data rows by structure (10+ cells and a numeric Nr. cell) instead of row CLASS names, so the two-line rows the distributor styles R23 are imported instead of silently dropped. Unmatched lines are listed by row, EAN and name in the upload modal, the apply confirm modal and the invoice summary. The upload modal unit total now counts matched lines only, the same number apply will add."
"1.0.7":
    - "Goods receiving now accepts EAN-8 and UPC-A barcodes next to EAN-13. The catalog on .no is mostly EAN-8 (4774 of 6199 numeric offer codes, 654 of them active), and the old 13-digit rule dropped every one of those invoice rows as invalid_ean. Codes are compared exactly as printed, a 12-digit UPC-A is never zero-padded to 13. Any other length and any non-digit code is still skipped at row level and still rejected before the first matcher query."
"1.0.8":
    - "An EAN carried by two or more live offers is no longer matched to whichever row the database returned last. Exactly one active offer in the group is picked by rule (strategy offer_code_active); otherwise the line is marked ambiguous, the apply modal shows a select with every candidate (offer, product, active flag, current stock), and apply refuses to run until each ambiguous line has a pick. The pick is validated against the candidate set on the server and stored as offer_code_operator. Both code matchers share one grouping helper and still issue one query each. The invoice page lists ambiguous lines under their own heading."
